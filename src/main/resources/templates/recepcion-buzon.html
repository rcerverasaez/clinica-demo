<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{title.outbox})}"></head>
<body>
<header class="top" th:replace="~{fragments/layout :: nav}"></header>

<main id="contenido">
    <p><a th:href="@{/recepcion}" th:text="#{common.back-upcoming}">← Volver a citas próximas</a></p>
    <h1 th:text="#{outbox.title}">Buzón de recordatorios</h1>
    <p class="hint" th:text="#{outbox.hint}">Simulación: los recordatorios se guardan aquí y no se envían por correo.</p>

    <div class="alert ok" role="status" th:if="${sent != null}" th:text="#{outbox.sent(${sent})}">Recordatorios nuevos en el buzón: 0.</div>

    <form method="post" th:action="@{/recepcion/buzon/enviar}">
        <button class="btn ghost" type="submit" th:text="#{outbox.prepare}">Preparar recordatorios ahora</button>
    </form>

    <p class="empty" th:if="${notifications.isEmpty()}" th:text="#{outbox.empty}">El buzón está vacío.</p>

    <div class="table-wrap" tabindex="0" th:unless="${notifications.isEmpty()}">
        <table>
            <thead>
            <tr>
                <th scope="col" th:text="#{outbox.saved}">Guardado</th>
                <th scope="col" th:text="#{outbox.recipient}">Destinatario</th>
                <th scope="col" th:text="#{outbox.subject}">Asunto</th>
                <th scope="col" th:text="#{outbox.body}">Mensaje</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="n : ${notifications}">
                <td th:text="${#temporals.format(n.sentAt, 'dd/MM HH:mm')}">01/01 10:00</td>
                <td th:text="${n.recipient}">correo</td>
                <td th:text="${n.subject}">Asunto</td>
                <td th:text="${n.body}">Texto</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
