<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mensajes de la cita')}"></head>
<body>
<header class="top" th:replace="~{fragments/layout :: nav}"></header>

<main class="narrow">
    <p><a th:href="@{/recepcion}">← Volver a citas próximas</a></p>
    <h1>Mensajes de la cita</h1>
    <p>
        <span th:text="${appointment.treatment.name}">Consulta</span>,
        <span th:text="${#temporals.format(appointment.startAt, 'dd/MM/yyyy HH:mm')}">01/01/2030 10:00</span>
        · <span th:text="${appointment.patientName}">Paciente</span>
        · Código <strong class="code" th:text="${appointment.code}">ABCD1234</strong>
    </p>

    <div class="alert error" th:if="${bookingError}" th:text="${bookingError}">Error</div>

    <section class="card">
        <h2>Conversación</h2>
        <p class="empty" th:if="${messages.isEmpty()}">Todavía no hay mensajes.</p>
        <ul th:unless="${messages.isEmpty()}">
            <li th:each="m : ${messages}">
                <strong th:text="${m.author.name() == 'PACIENTE' ? 'Paciente' : 'Recepción'}">Paciente</strong>
                <small class="meta" th:text="${#temporals.format(m.createdAt, 'dd/MM HH:mm')}">01/01 10:00</small>
                <p th:text="${m.body}">Mensaje</p>
            </li>
        </ul>

        <form class="form" method="post" th:action="@{/recepcion/citas/{id}/mensajes(id=${appointment.id})}">
            <label>
                Responder
                <textarea name="body" rows="3" maxlength="500" required></textarea>
            </label>
            <button class="btn" type="submit">Enviar respuesta</button>
        </form>
    </section>
</main>
</body>
</html>
