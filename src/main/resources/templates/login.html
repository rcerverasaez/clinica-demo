<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{title.login})}"></head>
<body>
<header class="top" th:replace="~{fragments/layout :: nav}"></header>

<main id="contenido" class="narrow">
    <h1 th:text="#{login.title}">Acceso del personal</h1>

    <div class="alert error" role="alert" th:if="${param.error}" th:text="#{login.error}">Usuario o contraseña incorrectos.</div>
    <div class="alert ok" role="status" th:if="${param.logout}" th:text="#{login.logged-out}">Has cerrado sesión.</div>

    <form id="login-form" class="form" method="post" th:action="@{/login}">
        <label>
            <span th:text="#{login.user}">Usuario</span>
            <input type="text" name="username" autocomplete="username" required>
        </label>
        <label>
            <span th:text="#{login.password}">Contraseña</span>
            <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button class="btn" type="button" th:data-error-message="#{login.failed}" th:text="#{login.submit}">Entrar</button>
    </form>
    <p class="hint" th:utext="#{login.hint}">Cuenta de prueba. Usuario: <code>vbote@vbote.com</code> · Contraseña: <code>Hola.001</code></p>
</main>
<script th:src="@{/js/login.js}"></script>
</body>
</html>
