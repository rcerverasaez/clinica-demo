<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{title.login})}"></head>
<body>
<header class="top" th:replace="~{fragments/layout :: nav}"></header>

<main id="contenido" class="narrow">
    <h1 th:text="#{login.title}">Acceso del personal</h1>

    <div class="alert error" role="alert" th:if="${param.error}" th:text="#{login.error}">Usuario o contraseña incorrectos.</div>
    <div class="alert ok" role="status" th:if="${param.logout}" th:text="#{login.logged-out}">Has cerrado sesión.</div>

    <form class="form" method="post" th:action="@{/login}">
        <label>
            <span th:text="#{login.user}">Usuario</span>
            <input type="text" name="username" autocomplete="username" required>
        </label>
        <label>
            <span th:text="#{login.password}">Contraseña</span>
            <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button class="btn" type="submit" th:text="#{login.submit}">Entrar</button>
    </form>
    <p class="hint" th:utext="#{login.hint}">Cuentas de demo: <code>recepcion</code> y <code>especialista</code>. Las contraseñas están en el README.</p>
</main>
</body>
</html>
