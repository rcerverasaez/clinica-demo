<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{title.appointment})}"></head>
<body>
<header class="top" th:replace="~{fragments/layout :: nav}"></header>

<main id="contenido" class="narrow">
    <p><a th:href="@{/agenda}" th:text="#{common.back-agenda}">← Volver a la agenda</a></p>
    <h1 th:text="${appointment.treatment.name}">Consulta</h1>
    <p>
        <span th:text="${#temporals.format(appointment.startAt, 'dd/MM/yyyy HH:mm')}">01/01/2030 10:00</span>
        <span th:text="#{book.with}">con</span> <span th:text="${appointment.specialist.name}">Especialista</span>
    </p>
    <p class="meta">
        <span th:text="#{common.patient}">Paciente</span>: <span th:text="${appointment.patientName}">Nombre</span> ·
        <span th:text="#{common.status}">Estado</span>: <strong th:text="#{${'status.' + appointment.status.name()}}">Confirmada</strong>
    </p>

    <div class="alert ok" role="status" th:if="${message}" th:text="#{${message}}">Mensaje</div>
    <div class="alert error" role="alert" th:if="${bookingError}" th:text="#{${bookingError}}">Error</div>

    <section class="card">
        <h2 th:text="#{agenda.documents}">Documentos</h2>
        <p class="empty" th:if="${documents.isEmpty()}" th:text="#{agenda.no-documents}">Todavía no hay documentos en esta cita.</p>
        <ul th:unless="${documents.isEmpty()}">
            <li th:each="d : ${documents}">
                <span th:text="${d.fileName}">analitica.pdf</span>
                <small class="meta" th:text="${#temporals.format(d.uploadedAt, 'dd/MM HH:mm')} + ' · ' + ${d.uploadedBy}">01/01 10:00 · especialista</small>
            </li>
        </ul>

        <form class="form" method="post" enctype="multipart/form-data"
              th:action="@{/agenda/citas/{id}/documentos(id=${appointment.id})}">
            <label>
                <span th:text="#{agenda.upload-label}">Subir documento (PDF, JPG o PNG, máximo 2 MB)</span>
                <input type="file" name="file" accept="application/pdf,image/jpeg,image/png" required>
            </label>
            <button class="btn" type="submit" th:text="#{agenda.upload}">Subir documento</button>
        </form>
    </section>
</main>
</body>
</html>
