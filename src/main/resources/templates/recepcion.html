<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{title.reception})}"></head>
<body>
<header class="top" th:replace="~{fragments/layout :: nav}"></header>

<main>
    <h1 th:text="#{reception.title}">Citas próximas</h1>

    <p><a th:href="@{/recepcion/buzon}" th:text="#{reception.outbox}">Buzón de recordatorios</a> · <a th:href="@{/recepcion/panel}" th:text="#{reception.panel}">Panel</a> · <a th:href="@{/recepcion/auditoria}" th:text="#{reception.audit}">Registro</a></p>

    <p class="empty" th:if="${#lists.isEmpty(appointments)}" th:text="#{reception.none}">No hay citas próximas.</p>

    <div class="table-wrap" th:unless="${#lists.isEmpty(appointments)}">
        <table>
            <thead>
            <tr>
                <th th:text="#{common.date}">Fecha</th>
                <th th:text="#{common.treatment}">Consulta</th>
                <th th:text="#{common.specialist}">Especialista</th>
                <th th:text="#{common.code}">Código</th>
                <th th:text="#{common.patient}">Paciente</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="a : ${appointments}">
                <td th:text="${#temporals.format(a.startAt, 'dd/MM HH:mm')}">01/01 10:00</td>
                <td th:text="${a.treatment.name}">Consulta</td>
                <td th:text="${a.specialist.name}">Especialista</td>
                <td class="code" th:text="${a.code}">ABCD1234</td>
                <td>
                    <span th:text="${a.patientName}">Nombre</span><br>
                    <small class="meta" th:text="${a.patientEmail}">correo</small>
                </td>
                <td>
                    <a class="meta" th:href="@{/recepcion/citas/{id}(id=${a.id})}" th:text="#{reception.messages}">Mensajes</a>
                    <form method="post" th:action="@{/recepcion/{id}/cancelar(id=${a.id})}">
                        <button class="btn ghost" type="submit" th:text="#{reception.cancel}">Cancelar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
