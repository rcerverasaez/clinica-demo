spring.application.name=clinica-demo
# Puerto poco habitual para no chocar con otros programas del equipo (el 8080 suele estar ocupado)
server.port=8765
spring.datasource.url=jdbc:h2:mem:clinica;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
clinica.demo-data=true
clinica.demo.recepcion-password=${CLINICA_RECEPCION_PASSWORD:recepcion-demo}
clinica.demo.especialista-password=${CLINICA_ESPECIALISTA_PASSWORD:especialista-demo}
clinica.demo.vbote-password=${CLINICA_VBOTE_PASSWORD:Hola.001}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
# Sin esto, un equipo con el sistema en inglés recibiría textos en inglés al pedir español.
spring.messages.fallback-to-system-locale=false

# Modos de preparación del buzón de recordatorios
clinica.outbox.standard.enabled=false
clinica.outbox.express.max-hours=12
clinica.outbox.grouped.sender=

# Proveedor de correo para recordatorios reales (todavía sin conectar)
clinica.mail.api-key=clave-demo-FICTICIA-4f8a2c91e7b3d06a
